; Final INT8 model on ESP32 -- Wokwi simulation project.
; Default env replays KFall S06T20R01; build :esp32dev_live for live MPU6050 input.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DREPLAY_MODE=1
lib_deps =
  tanakamasayuki/TensorFlowLite_ESP32@^1.0.0

[env:esp32dev_live]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DREPLAY_MODE=0
lib_deps =
  tanakamasayuki/TensorFlowLite_ESP32@^1.0.0
