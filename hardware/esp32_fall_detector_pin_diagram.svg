<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<defs>
 <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#dbeafe" stroke-width="1"/></pattern>
 <filter id="shadow"><feDropShadow dx="3" dy="5" stdDeviation="5" flood-opacity=".25"/></filter>
 <style>
 .title{font:700 31px Arial;fill:#0f172a}.subtitle{font:18px Arial;fill:#334155}.board{stroke:#0f172a;stroke-width:3;filter:url(#shadow)}.comp{font:700 19px Arial;fill:#fff}.pin{font:700 16px Arial;fill:#0f172a}.note{font:16px Arial;fill:#0f172a}.wirelabel{font:700 16px Arial;fill:#111827}.small{font:14px Arial;fill:#334155}.warning{font:700 17px Arial;fill:#991b1b}.box{fill:#fff;stroke:#64748b;stroke-width:2;rx:10}.wire{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
 </style>
</defs>
<rect width="1600" height="1100" fill="#f8fafc"/><rect x="25" y="25" width="1550" height="1050" fill="url(#grid)" opacity=".65"/>
<text x="55" y="62" class="title">ESP32 Pre-Impact Fall Detector — Physical Pin &amp; Wiring Diagram</text>
<text x="58" y="92" class="subtitle">Primary deployment: one MPU6050 at the waist • second MPU6050 is a spare/future wrist sensor, not connected by the current firmware</text>

<!-- TP4056 -->
<g class="board"><rect x="90" y="760" width="270" height="170" rx="12" fill="#15803d"/><rect x="105" y="780" width="240" height="105" rx="8" fill="#0f6b34"/></g>
<text x="145" y="815" class="comp">TP4056</text><text x="130" y="842" class="small" fill="white">LiPo CHARGER</text>
<circle cx="120" cy="900" r="11" fill="#e5e7eb"/><circle cx="175" cy="900" r="11" fill="#e5e7eb"/><circle cx="280" cy="900" r="11" fill="#e5e7eb"/><circle cx="330" cy="900" r="11" fill="#e5e7eb"/>
<text x="101" y="952" class="pin">B+</text><text x="158" y="952" class="pin">B−</text><text x="260" y="952" class="pin">OUT+</text><text x="312" y="952" class="pin">OUT−</text>

<!-- battery -->
<rect x="80" y="970" width="280" height="70" rx="15" fill="#cbd5e1" stroke="#475569" stroke-width="3" filter="url(#shadow)"/><rect x="115" y="985" width="195" height="40" rx="6" fill="#fbbf24"/><text x="125" y="1012" class="note">3.7V LiPo 1000mAh</text><circle cx="350" cy="1005" r="8" fill="#dc2626"/><text x="55" y="1065" class="small">Battery is optional for first USB-powered test</text>

<!-- ESP32 -->
<g class="board"><rect x="590" y="250" width="400" height="430" rx="20" fill="#111827"/><rect x="650" y="355" width="220" height="165" rx="8" fill="#64748b"/><rect x="685" y="390" width="150" height="95" rx="4" fill="#94a3b8"/></g>
<text x="697" y="440" class="comp">ESP32</text><text x="678" y="475" class="small" fill="white">DevKit V1 / 38-pin</text>
<!-- ESP pins left/right -->
<g fill="#f8fafc" stroke="#0f172a" stroke-width="2"><circle cx="590" cy="300" r="9"/><circle cx="590" cy="350" r="9"/><circle cx="590" cy="400" r="9"/><circle cx="590" cy="450" r="9"/><circle cx="590" cy="500" r="9"/><circle cx="590" cy="550" r="9"/><circle cx="590" cy="600" r="9"/><circle cx="990" cy="300" r="9"/><circle cx="990" cy="350" r="9"/><circle cx="990" cy="400" r="9"/><circle cx="990" cy="450" r="9"/><circle cx="990" cy="500" r="9"/><circle cx="990" cy="550" r="9"/><circle cx="990" cy="600" r="9"/></g>
<text x="455" y="306" class="pin">3V3</text><text x="450" y="356" class="pin">GND</text><text x="445" y="406" class="pin">VIN</text><text x="445" y="456" class="pin">D21</text><text x="445" y="506" class="pin">D22</text><text x="445" y="556" class="pin">D2</text><text x="445" y="606" class="pin">D4</text>
<text x="1005" y="306" class="pin">3V3</text><text x="1005" y="356" class="pin">GND</text><text x="1005" y="406" class="pin">D21</text><text x="1005" y="456" class="pin">D22</text><text x="1005" y="506" class="pin">D2</text><text x="1005" y="556" class="pin">D4</text><text x="1005" y="606" class="pin">GND</text>

<!-- MPU -->
<g class="board"><rect x="1160" y="160" width="300" height="330" rx="14" fill="#1769aa"/><rect x="1245" y="250" width="120" height="115" rx="8" fill="#475569"/></g>
<text x="1190" y="205" class="comp">MPU6050 / GY-521</text><text x="1200" y="400" class="small" fill="white">PRIMARY WAIST IMU</text>
<g fill="#f8fafc" stroke="#0f172a" stroke-width="2"><circle cx="1160" cy="220" r="9"/><circle cx="1160" cy="275" r="9"/><circle cx="1160" cy="330" r="9"/><circle cx="1160" cy="385" r="9"/><circle cx="1460" cy="220" r="9"/><circle cx="1460" cy="275" r="9"/></g>
<text x="1055" y="226" class="pin">VCC</text><text x="1055" y="281" class="pin">GND</text><text x="1055" y="336" class="pin">SDA</text><text x="1055" y="391" class="pin">SCL</text><text x="1475" y="226" class="pin">AD0</text><text x="1475" y="281" class="pin">INT unused</text>
<text x="1180" y="445" class="wirelabel">I2C address = 0x68</text>

<!-- wires ESP to MPU -->
<path d="M590 300 H520 V220 H1160" class="wire" stroke="#ef4444"/><text x="700" y="212" class="wirelabel">RED: 3V3 → VCC</text>
<path d="M590 350 H500 V275 H1160" class="wire" stroke="#111827"/><text x="690" y="270" class="wirelabel">BLACK: GND → GND</text>
<path d="M990 400 H1060 V330 H1160" class="wire" stroke="#16a34a"/><text x="1010" y="320" class="wirelabel">GREEN: D21 → SDA</text>
<path d="M990 450 H1080 V385 H1160" class="wire" stroke="#eab308"/><text x="1010" y="375" class="wirelabel">YELLOW: D22 → SCL</text>
<path d="M1460 220 H1510 V350 H500" class="wire" stroke="#111827"/><text x="1320" y="345" class="wirelabel">AD0 → common GND</text>

<!-- buzzer -->
<circle cx="1270" cy="620" r="72" fill="#111827" stroke="#475569" stroke-width="5" filter="url(#shadow)"/><circle cx="1270" cy="620" r="43" fill="#020617"/><circle cx="1270" cy="620" r="9" fill="#cbd5e1"/><text x="1194" y="725" class="wirelabel">ACTIVE BUZZER</text><text x="1185" y="750" class="small">+ → D4 • − → GND</text>
<path d="M990 600 H1120 V585 H1200" class="wire" stroke="#16a34a"/><path d="M1340 620 H1420 V820 H500 V350" class="wire" stroke="#111827"/>

<!-- LED -->
<rect x="760" y="745" width="35" height="82" rx="17" fill="#ef4444" stroke="#991b1b" stroke-width="3" filter="url(#shadow)"/><rect x="726" y="700" width="105" height="18" rx="8" fill="#d6a647" stroke="#92400e" stroke-width="2"/><text x="720" y="865" class="wirelabel">RED LED</text><text x="695" y="890" class="small">D2 → 220Ω → LED anode</text><text x="715" y="912" class="small">LED cathode → GND</text>
<path d="M990 500 H1040 V700 H830" class="wire" stroke="#16a34a"/><path d="M760 827 V940 H500 V350" class="wire" stroke="#111827"/>

<!-- power wires -->
<path d="M280 900 H390 V400 H590" class="wire" stroke="#ef4444"/><text x="300" y="885" class="wirelabel">TP4056 OUT+ → ESP32 VIN</text>
<path d="M330 900 H430 V350 H590" class="wire" stroke="#111827"/><text x="300" y="935" class="wirelabel">TP4056 OUT− → ESP32 GND</text>
<path d="M120 900 V950" class="wire" stroke="#ef4444"/><path d="M175 900 V950" class="wire" stroke="#111827"/>

<!-- notes -->
<rect x="55" y="115" width="430" height="230" class="box"/>
<text x="80" y="150" class="wirelabel">BUILD ORDER</text>
<text x="80" y="182" class="note">1. Test with ESP32 USB power first.</text>
<text x="80" y="210" class="note">2. Connect one waist MPU6050.</text>
<text x="80" y="238" class="note">3. Verify I2C address 0x68.</text>
<text x="80" y="266" class="note">4. Test LED and buzzer.</text>
<text x="80" y="294" class="note">5. Add TP4056 + LiPo last.</text>
<text x="80" y="322" class="warning">Do not use 5V on MPU6050 VCC.</text>

<rect x="1030" y="800" width="500" height="190" class="box"/>
<text x="1055" y="835" class="wirelabel">CURRENT FIRMWARE MODE</text>
<text x="1055" y="868" class="note">Live sensor: REPLAY_MODE = 0</text>
<text x="1055" y="898" class="note">KFall replay: REPLAY_MODE = 1</text>
<text x="1055" y="928" class="note">Model input: 100 samples × 6 channels</text>
<text x="1055" y="958" class="note">Sampling: 50 Hz • stride: 25 samples</text>
</svg>